<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tolk DA ⇄ RU</title>
<!-- Google's online speech answers 404 when a foreign site is named as referrer, so send none. -->
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one screen at a time (language → start → code → chat, or two facing panels on one device),
   with the composer docked at the bottom while talking. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --fg: #1b1f27; --muted: #5d6573; --line: #d9dde4;
  --da: #b4232f; --da-soft: #fbe9ea; --ru: #1f4fa3; --ru-soft: #e7eefb; --warn: #8a5a00; --warn-soft: #fff3d6; --ok: #1f8a4c;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b2029; --fg: #e8ebf0; --muted: #9aa3b2; --line: #2d3440;
    --da: #ff6b74; --da-soft: #3a1d22; --ru: #7aa7ff; --ru-soft: #1b2843; --warn: #ffc865; --warn-soft: #3a2e12; --ok: #4cc98a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b2029; --fg: #e8ebf0; --muted: #9aa3b2; --line: #2d3440;
  --da: #ff6b74; --da-soft: #3a1d22; --ru: #7aa7ff; --ru-soft: #1b2843; --warn: #ffc865; --warn-soft: #3a2e12; --ok: #4cc98a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
}
.app { max-width: 980px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
.app.fill { height: 100%; min-height: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--ru) 55%, transparent); outline-offset: 2px;
}
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 1.15rem; font-weight: 600; }
.brand span { color: var(--muted); font-weight: 400; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 7px 11px; font: 600 .82rem var(--mono); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.icon { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.icon svg { width: 20px; height: 20px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 18px; font-weight: 600; }
.btn.main { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: .9rem; font-weight: 500; }
.btn svg { width: 18px; height: 18px; }

/* screens */
.screen { flex: 1 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.big { font-size: clamp(1.45rem, 3.2vw, 2rem); font-weight: 600; line-height: 1.2; }
.lead { color: var(--muted); max-width: 60ch; }
.fine { font-size: .85rem; color: var(--muted); max-width: 72ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h2 { font-size: 1.15rem; font-weight: 600; }
.card p { color: var(--muted); }
.card .btn { justify-self: start; margin-top: 4px; }

/* language screen */
.center { justify-content: center; align-items: center; text-align: center; }
.center .big span { display: block; color: var(--muted); font-weight: 400; }
.langpick { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 16px; width: 100%; justify-content: center; }
@media (max-width: 560px) { .langpick { grid-template-columns: minmax(0, 1fr); } }
.pick { border: 0; border-radius: 18px; padding: 28px 20px; color: #fff; display: grid; gap: 6px; font-size: 1.7rem; font-weight: 600; }
.pick small { font-size: 1rem; font-weight: 400; opacity: .9; }
.pick.da { background: var(--da); } .pick.ru { background: var(--ru); }

/* start screen */
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.card.primary { border: 2px solid var(--fg); }
.codein { width: 100%; font: 600 1.5rem var(--mono); letter-spacing: .14em; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.codein::placeholder { color: var(--muted); opacity: .5; }
.card label { font-size: .9rem; color: var(--muted); }

/* waiting for the other device */
.waitcard { gap: 18px; padding: 24px; }
.state { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.wait, .dot.left { background: var(--warn); } .dot.err { background: var(--da); }
.code { font: 600 clamp(2.6rem, 9vw, 4rem)/1 var(--mono); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.waitgrid { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.steps { flex: 1 1 300px; display: grid; gap: 10px; min-width: 0; }
.steps .other { color: var(--muted); }
.qrbox { display: grid; gap: 6px; justify-items: center; text-align: center; font-size: .85rem; color: var(--muted); }
.qr { background: #fff; padding: 10px; border-radius: 10px; line-height: 0; }
.qr svg { width: 150px; height: 150px; display: block; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

/* chat */
.chatbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.chatbar .codechip { font: 500 .85rem var(--mono); color: var(--muted); }
.chat { flex: 1 1 auto; min-height: 220px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 46ch; }
.chatList { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: min(85%, 62ch); padding: 10px 14px; border-radius: 16px; display: grid; gap: 4px; min-width: 0; }
.msg.mine { align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.mine.da { background: var(--da-soft); } .msg.mine.ru { background: var(--ru-soft); }
.msg.theirs { align-self: flex-start; border-bottom-left-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.msg.theirs.da { border-left: 4px solid var(--ru); } .msg.theirs.ru { border-left: 4px solid var(--da); }
.mtext { font-size: 1.25rem; line-height: 1.35; overflow-wrap: anywhere; }
.msub { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); min-height: 1em; }
.meta:empty { display: none; }
.meta.err { color: var(--da); }
.mine .meta { justify-content: flex-end; }
.replay { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: .8rem; text-decoration: underline; text-underline-offset: 2px; }
.replay svg { width: 15px; height: 15px; }
.note { font-size: .9rem; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 4px 8px; }
.talking .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.talking .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.talking .dots i:nth-child(2) { animation-delay: .2s; } .talking .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* one device: two facing panels */
.solobar { display: flex; gap: 8px; flex-wrap: wrap; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 16px;
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-height: 230px; min-width: 0;
}
.panel.da { --c: var(--da); --soft: var(--da-soft); } .panel.ru { --c: var(--ru); --soft: var(--ru-soft); }
.flip .panel.ru { transform: rotate(180deg); }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lang { font-weight: 600; color: var(--c); letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }
.role { font: .75rem var(--mono); color: var(--muted); }
.text { font-size: clamp(1.25rem, 2.6vw, 1.9rem); line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
.text.interim { color: var(--muted); font-style: italic; }
.text.empty { color: var(--muted); font-size: 1.05rem; }
.text .note { display: block; margin-top: 10px; }
.text .back { display: block; margin-top: 10px; font-size: .95rem; color: var(--muted); }
.pf { display: flex; gap: 8px; flex-wrap: wrap; }
.say { background: var(--soft); color: var(--c); border: 0; border-radius: 999px; padding: 14px 16px; font-weight: 500; }
details.log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
details.log summary { cursor: pointer; padding: 10px 14px; font-weight: 500; }
.log ol { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 8px; max-height: 40vh; overflow: auto; }
.log li { display: grid; grid-template-columns: 2.6rem 1fr; gap: 2px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.log .tag { font: 600 .72rem var(--mono); grid-row: span 2; padding-top: 3px; }
.log .tag.da { color: var(--da); } .log .tag.ru { color: var(--ru); }
.log .src { color: var(--muted); font-size: .9rem; } .log .dst { overflow-wrap: anywhere; }

/* mic buttons */
.mic {
  --c: var(--fg); flex: 1 1 180px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--c); color: #fff; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 600;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.mic.da { --c: var(--da); } .mic.ru { --c: var(--ru); }
.mic svg { width: 20px; height: 20px; flex: none; }
.mic.on { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--c) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) {
  .mic.on { animation: none; outline: 3px solid var(--c); outline-offset: 3px; }
  .talking .dots i { animation: none; opacity: .7; }
}

/* composer */
.dock { display: grid; gap: 8px; }
.review { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 14px; }
.review .rtext { flex: 1 1 160px; font-size: .92rem; font-weight: 500; min-width: 0; }
.rbar { flex-basis: 100%; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; order: 9; }
.rbar span { display: block; height: 100%; width: 0; background: var(--fg); }
.review.editing .rbar, .review.editing #editNow { display: none; }
form.compose { display: flex; gap: 8px; align-items: stretch; }
.compose .mic { flex: 0 0 auto; padding: 0 20px; min-height: 52px; }
textarea {
  flex: 1; min-width: 0; resize: none; min-height: 52px; max-height: 160px; font: inherit; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px;
}
.send { flex: none; display: inline-flex; align-items: center; gap: 8px; background: var(--fg); color: var(--bg); border: 0; border-radius: 12px; padding: 0 18px; font-weight: 600; }
.send svg { width: 18px; height: 18px; }
@media (max-width: 560px) {
  form.compose { flex-wrap: wrap; }
  .compose .mic { flex: 1 1 100%; padding: 12px 20px; }
  .send { padding: 0 16px; }
  .send span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.keys { font-size: .8rem; color: var(--muted); }
kbd { font: .75rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); color: var(--fg); }
@media (hover: none), (pointer: coarse) { .keys { display: none; } }
.soundBtn { justify-self: start; border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 600; background: var(--warn-soft); color: var(--warn); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  width: max-content; max-width: min(560px, calc(100vw - 32px)); background: var(--fg); color: var(--bg);
  border-radius: 12px; padding: 12px 16px; font-size: .92rem; box-shadow: 0 6px 24px rgb(0 0 0 / .2);
}
.toast.err { background: var(--da); color: #fff; }

/* settings dialog */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); background: var(--panel); color: var(--fg); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg { padding: 20px; display: grid; gap: 18px; }
.dlghead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlghead h2 { font-size: 1.2rem; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: grid; gap: 12px; }
legend { padding: 0 0 8px; font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .88rem; color: var(--muted); }
.dlg select, .dlg input[type=text], .dlg input[type=url] {
  width: 100%; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
}
.vrow { display: flex; gap: 8px; }
.vrow select { flex: 1 1 auto; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { flex: none; width: 18px; height: 18px; margin: 0; }
.adv summary { cursor: pointer; font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.adv[open] summary { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Tolk <span data-t="sub"></span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Sprog / Язык">
        <button type="button" data-ui="da" title="Dansk">DA</button>
        <button type="button" data-ui="ru" title="Русский">RU</button>
      </div>
      <button type="button" class="icon" id="setBtn" data-ta="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <!-- 1. choose language -->
  <section class="screen center" id="scrLang" hidden>
    <h1 class="big">Vælg dit sprog<span lang="ru">Выберите свой язык</span></h1>
    <div class="langpick">
      <button type="button" class="pick da" data-pick="da">Dansk<small>Jeg taler dansk</small></button>
      <button type="button" class="pick ru" data-pick="ru" lang="ru">Русский<small>Я говорю по-русски</small></button>
    </div>
  </section>

  <!-- 2. how do you want to talk -->
  <section class="screen" id="scrHome" hidden>
    <h1 class="big" data-t="homeTitle"></h1>
    <div class="cards">
      <article class="card primary">
        <h2 data-t="twoTitle"></h2>
        <p data-t="twoDesc"></p>
        <button type="button" class="btn main" id="startBtn" data-t="twoBtn"></button>
      </article>
      <form class="card" id="joinForm" novalidate>
        <h2 data-t="joinTitle"></h2>
        <label for="joinCode" data-t="joinLabel"></label>
        <input id="joinCode" class="codein" inputmode="numeric" autocomplete="off" placeholder="1234 5678" maxlength="12">
        <button type="submit" class="btn main" data-t="joinBtn"></button>
      </form>
      <article class="card">
        <h2 data-t="soloTitle"></h2>
        <p data-t="soloDesc"></p>
        <button type="button" class="btn" id="soloBtn" data-t="soloBtn"></button>
      </article>
    </div>
    <p class="fine" data-t="privacy"></p>
  </section>

  <!-- 3. waiting for the other device -->
  <section class="screen" id="scrWait" hidden>
    <div class="card waitcard">
      <p class="state"><span class="dot wait"></span><span data-t="waiting"></span></p>
      <h1 class="big" data-t="waitTitle"></h1>
      <div class="code" id="codeText" aria-live="polite"></div>
      <div class="waitgrid">
        <div class="steps"><p id="howOwn"></p><p id="howOther" class="other"></p></div>
        <div class="qrbox"><div class="qr" id="qr"></div><span data-t="orScan"></span></div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="copyLink" data-t="copyLink"></button>
        <button type="button" class="btn ghost" id="cancelWait" data-t="cancel"></button>
      </div>
    </div>
  </section>

  <!-- 4. chat between two devices -->
  <section class="screen" id="scrChat" hidden>
    <div class="chatbar">
      <p class="state"><span class="dot" id="chatDot"></span><span id="chatState"></span><span class="codechip" id="codeChip"></span></p>
      <button type="button" class="btn small" id="leaveBtn" data-t="leave"></button>
    </div>
    <div class="chat" id="chat">
      <p class="empty" id="chatEmpty" data-t="chatEmpty"></p>
      <ol class="chatList" id="chatList" aria-live="polite"></ol>
    </div>
  </section>

  <!-- 5. one device, two facing panels -->
  <section class="screen" id="scrSolo" hidden>
    <div class="solobar">
      <button type="button" class="btn small" id="backBtn" data-t="backHome"></button>
      <button type="button" class="btn small ghost" id="flipBtn" aria-pressed="false" data-t="flip"></button>
      <button type="button" class="btn small ghost" id="clearBtn" data-t="clear"></button>
    </div>
    <main class="stage" id="stage">
      <section class="panel da" aria-label="Dansk" lang="da">
        <div class="ph"><span class="lang">Dansk</span><span class="role" id="daRole"></span></div>
        <div class="text empty" id="daText" aria-live="polite"></div>
        <div class="pf">
          <button type="button" class="mic da" id="daMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="ml"></span></button>
          <button type="button" class="say" id="daSay">Læs op</button>
        </div>
      </section>
      <section class="panel ru" aria-label="Русский" lang="ru">
        <div class="ph"><span class="lang">Русский</span><span class="role" id="ruRole"></span></div>
        <div class="text empty" id="ruText" aria-live="polite"></div>
        <div class="pf">
          <button type="button" class="mic ru" id="ruMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="ml"></span></button>
          <button type="button" class="say" id="ruSay">Озвучить</button>
        </div>
      </section>
    </main>
    <details class="log">

  }
  const opt = k => ($(k).type === "checkbox" ? $(k).checked : $(k).value.trim());

  // ---------- interface language ----------
  // Each person picks their own language once; the whole interface then speaks only that language.
  let ui = store.get("ui");

  }

  let screen = null;
  function go(name) {

  const countCyr = s => (s.match(/[Ѐ-ӿ]/g) || []).length;

  function segments(text) {
    const parts = text.match(/[^.!?…\n]+[.!?…]*[\s\n]*|[\s\n]+/g) || [text];

      if (last && last.lang === lang) last.text += p; else out.push({ lang, text: p });

  // ---------- providers ----------
  async function google(q, sl, tl) {
    const u = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" + sl + "&tl=" + tl + "&q=" + encodeURIComponent(q);

    if (!r.ok) throw new Error("Google " + r.status);
    const j = await r.json();

      cur += s;
    }

      let u = "https://api.mymemory.translated.net/get?langpair=" + sl + "|" + tl + "&q=" + encodeURIComponent(c);

    const r = await fetch(base + "/translate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();

  async function translateText(q, sl, tl) {

    const order = [first].concat(opt("fallback") ? ["google", "mymemory"].filter(p => p !== first) : []);

    if (a.length > 3 && a.toLowerCase() === b.toLowerCase()) return true;
    return false;

      segs, results,
      srcLang: segs.length === 1 ? segs[0].lang : detect(text),
      dst: clean(results.join(" ")),
      unsure: segs.some((s, i) => needsConfirm(s.text, results[i]))

  }

    text = text.trim();
    if (!text) return;
    if (screen === "Chat") chatSend(text); else soloSend(text);
  }

  // ---------- one device ----------
  let last = { da: "", ru: "" };
  function setPanel(lang, text, opts = {}) {
    const el = $(lang + "Text");
    el.className = "text" + (opts.interim ? " interim" : "");
    el.textContent = text;
    if (opts.unsure) el.append(make("span", "note", CONFIRM));
    if (opts.back !== undefined) {
      const b = make("span", "back", t("back", null, lang) + " " + (opts.back ?? "…"));
      b.id = "panelBack";
      el.append(b);
    }
  }
  async function soloSend(text) {
    const guess = detect(text);
    setPanel(guess, text);
    setPanel(other(guess), "…", { interim: true });
    let r;
    try { r = await translateMsg(text); }
    catch (e) { setPanel(other(guess), ""); toast(t("trFail", { e: e.message }), true); return; }
    const tl = other(r.srcLang);
    last[r.srcLang] = text; last[tl] = r.dst;
    setPanel(r.srcLang, text, { back: null });
    setPanel(tl, r.dst, { unsure: r.unsure });
    $(r.srcLang + "Role").textContent = r.srcLang === "da" ? "original" : "оригинал";

    let back = null;
    try { back = await backTranslate(r); } catch {}
    const pb = $("panelBack");
    if (pb && last[r.srcLang] === text) pb.textContent = t("back", null, r.srcLang) + " " + (back || t("noBack", null, r.srcLang));
  }
  function addLog(srcLang, src, dst, unsure) {
    const li = document.createElement("li");
    li.append(make("span", "tag " + srcLang, srcLang.toUpperCase() + "→" + other(srcLang).toUpperCase()), make("span", "src", src), make("span", "dst", dst + (unsure ? " " + CONFIRM : "")));

  // ---------- chat ----------
  const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  function make(tag, cls, text) {

  let seq = 0;
  async function chatSend(text) {

  const gotMids = new Set();

  function markDelivered(mid) {

  let talkTimer = null;
  function showTalking() {

  function hideTalking() {

  // ---------- text to speech ----------
  // Chrome loads voices asynchronously, and its built-in online voices (e.g. "Google русский") often
  // fail silently, especially when speak() follows cancel(). So the default plays Google's online
  // speech as ordinary audio; "auto" uses an installed local voice when there is one.
  const hasSynth = "speechSynthesis" in window;
  let voices = [], audio = null, speakToken = 0, utterances = [];
  const matching = lang => voices.filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang));

  function fillVoiceLists() {
    for (const lang of ["da", "ru"]) {
      const sel = $(lang + "Voice");
      sel.innerHTML = "";
      sel.append(new Option(t("vOnline"), "online"), new Option(t("vAuto"), "auto"));
      for (const v of matching(lang)) sel.append(new Option(v.name + (v.localService ? "" : t("vBrowserOnline")), v.voiceURI));
      const saved = store.get(lang + "Voice");
      if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
    }
  }
  function loadVoices() { voices = hasSynth ? speechSynthesis.getVoices() : []; fillVoiceLists(); }
  if (hasSynth) speechSynthesis.addEventListener("voiceschanged", loadVoices);
  for (const lang of ["da", "ru"]) $(lang + "Voice").addEventListener("change", e => store.set(lang + "Voice", e.target.value));

  function pickVoice(lang) {
    const choice = $(lang + "Voice").value;
    if (choice === "online" || !hasSynth) return "online";
    if (choice !== "auto") { const v = voices.find(v => v.voiceURI === choice); if (v) return v; }
    return matching(lang).find(v => v.localService) || "online";
  }

  // Both Chrome and Google's online speech cut off long text, so speak in pieces of at most ~180 characters.
  function pieces(text, max = 180) {
    const out = [];
    let cur = "";
    for (const w of text.split(/\s+/)) {
      if (cur && (cur + " " + w).length > max) { out.push(cur); cur = w; }
      else cur = cur ? cur + " " + w : w;
      if (/[.!?…]$/.test(cur) && cur.length > max / 2) { out.push(cur); cur = ""; }
    }
    if (cur) out.push(cur);
    return out;
  }

  function stopSpeaking() {
    speakToken++;
    if (hasSynth) speechSynthesis.cancel();
    if (audio) { audio.pause(); audio = null; }
  }

  // iPhone and iPad only play sound from an element that was first started by a tap, and a message
  // from the other device arrives without one. So reuse a single element and unlock it on the first
  // tap or key press; if sound is still refused, offer a button to play the message.
  const player = new Audio();
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  let unlocked = false, pendingSound = null;
  function unlockAudio() {
    if (unlocked) return;
    unlocked = true;
    player.src = SILENT;
    player.play().catch(() => { unlocked = false; });
    if (hasSynth) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  }
  ["pointerup", "touchend", "keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true }));

  async function playOnline(parts, lang, token, synthFallback) {
    if (hasSynth) speechSynthesis.cancel();
    for (const p of parts) {
      if (token !== speakToken) return;
      const a = audio = player;
      a.src = "https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=" + lang + "&q=" + encodeURIComponent(p);
      const done = new Promise((res, rej) => { a.onended = res; a.onerror = rej; });
      try { await a.play(); await done; }
      catch (e) {
        if (token !== speakToken) return;
        if (e?.name === "NotAllowedError") {
          pendingSound = { parts, lang };
          $("soundBtn").hidden = false;
          return;
        }
        // Last resort: the browser's own voice for the language, even an online one.
        const v = synthFallback && matching(lang)[0];
        if (v) return speakWith(v, parts, lang, token, false);
        toast(t("playFail"), true);
        return;
      }
    }
  }

  async function speak(text, lang) {
    stopSpeaking();
    $("soundBtn").hidden = true; pendingSound = null;
    if (!text) return;
    const token = speakToken, parts = pieces(text), voice = pickVoice(lang);
    if (voice === "online") return playOnline(parts, lang, token, true);
    speakWith(voice, parts, lang, token, true);
  }

  async function speakWith(voice, parts, lang, token, onlineFallback) {
    await new Promise(r => setTimeout(r, 150)); // Chrome drops an utterance spoken right after cancel()
    if (token !== speakToken) return;
    let failed = false;
    utterances = parts.map(p => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = LANG[lang].tts;
      u.voice = voice;
      u.onerror = e => {
        if (failed || token !== speakToken || e.error === "interrupted" || e.error === "canceled") return;
        failed = true;
        if (onlineFallback) playOnline(parts, lang, token, false);
        else toast(t("playFail"), true);
      };
      return u;
    });
    utterances.forEach(u => speechSynthesis.speak(u));
  }

  $("soundBtn").onclick = () => {
    $("soundBtn").hidden = true;
    unlocked = true;
    const p = pendingSound;
    pendingSound = null;
    stopSpeaking();
    if (p) playOnline(p.parts, p.lang, speakToken, true); // starts playing inside this tap
  };
  $("daSay").onclick = () => speak(last.da, "da");
  $("ruSay").onclick = () => speak(last.ru, "ru");
  $("daTest").onclick = () => speak("Goddag. Hvordan går det?", "da");
  $("ruTest").onclick = () => speak("Здравствуйте. Как у Вас дела?", "ru");

  // ---------- speech recognition ----------
  // Tap the mic: it listens until you stop talking (or tap again). Hold it with a mouse, or hold the
  // space bar: it listens until you let go.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recLang = null, recMode = null, recTimer = null, pttLang = "da";
  function stopRec() { if (rec) { try { rec.stop(); } catch {} } }
  function startRec(lang, mode) {
    if (!SR) { toast(t("noSR"), true); return; }
    if (rec) return;
    flushReview();
    stopSpeaking();
    const r = rec = new SR();
    recLang = pttLang = lang;
    recMode = mode;
    r.lang = LANG[lang].tts;
    r.interimResults = true;
    r.continuous = true;
    let finalText = "", interim = "";
    const started = performance.now();
    let lastHeard = started;
    render();
    if (screen === "Chat") relaySend({ k: "talk" });
    r.onresult = e => {
      interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tx = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += (finalText && !/^\s/.test(tx) ? " " : "") + tx;
        else interim += tx;
      }
      lastHeard = performance.now();
      showLive(lang, (finalText + " " + interim).trim());

      if (e.error === "aborted") return;
      const k = { "not-allowed": "micBlocked", "service-not-allowed": "micBlocked", "no-speech": "noSpeech", "network": "srNet" }[e.error];
      toast(k ? t(k) : t("srErr", { e: e.error }), true);
    };
    recTimer = setInterval(() => {
      const now = performance.now();
      if (recMode !== "tap") { if (now - started > 60000) stopRec(); return; }
      const heard = (finalText + interim).trim();
      if ((heard && now - lastHeard > 1600) || (!heard && now - started > 8000)) stopRec();
    }, 250);
    r.onend = () => {
      clearInterval(recTimer);
      rec = null;
      render();
      const text = (finalText + " " + interim).trim();
      if (text) review(text);
      else { if (screen === "Solo") clearLive(lang); if (screen === "Chat") relaySend({ k: "idle" }); }
    };
    try { r.start(); } catch { rec = null; clearInterval(recTimer); render(); }
  }
  function showLive(lang, text) {

    else { $("input").value = text; autosize(); }
  }
  function clearLive(lang) {
    if (last[lang]) setPanel(lang, last[lang]); else { $(lang + "Text").className = "text empty"; render(); }
  }

  function bindMic(btn, langFn) {
    let downAt = 0, held = false, skipClick = false;
    btn.addEventListener("pointerdown", e => {

      if (e.pointerType === "touch" || e.button !== 0) return;

      if (rec) { stopRec(); return; }
      held = true;
      downAt = performance.now();
      startRec(langFn(), "hold");
    });
    window.addEventListener("pointerup", () => {
      if (!held) return;
      held = false;
      if (rec) { if (performance.now() - downAt > 700) stopRec(); else recMode = "tap"; }
    });
    btn.addEventListener("click", () => {
      if (skipClick) { skipClick = false; return; }
      if (rec) stopRec(); else startRec(langFn(), "tap");
    });

  }
  bindMic($("myMic"), () => myLang());
  bindMic($("daMic"), () => "da");
  bindMic($("ruMic"), () => "ru");

  // ---------- review spoken text before it is sent ----------
  let reviewTimer = null;
  function review(text) {
    const inp = $("input");

    autosize();
    const d = opt("reviewDelay");
    if (d === "0") return sendInput();
    if (d === "manual") return editMode();
    const secs = +d || 3;
    let left = secs;
    const box = $("review");
    box.classList.remove("editing");
    box.hidden = false;
    $("reviewText").textContent = t("sendIn", { n: left });
    const fill = $("rbarFill");
    fill.style.transition = "none";
    fill.style.width = "0%";
    void fill.offsetWidth;
    fill.style.transition = "width " + secs + "s linear";
    fill.style.width = "100%";

    reviewTimer = setInterval(() => {

  }
  function editMode() {
    clearInterval(reviewTimer); reviewTimer = null;

    $("reviewText").textContent = t("editHint");
    $("input").focus();
  }
  function hideReview() {
    clearInterval(reviewTimer); reviewTimer = null;

    $("review").classList.remove("editing");
  }
  function sendInput() {
    hideReview();
    const v = $("input").value;
    $("input").value = "";
    autosize();
    submitText(v);
  }
  function flushReview() { if (reviewTimer) sendInput(); }
  $("sendNow").onclick = sendInput;
  $("editNow").onclick = editMode;

  // ---------- text input ----------
  function autosize() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight + 2, 160) + "px"; }
  $("compose").addEventListener("submit", e => { e.preventDefault(); sendInput(); });
  $("input").addEventListener("input", autosize);
  $("input").addEventListener("pointerdown", () => { if (reviewTimer) editMode(); });
  $("input").addEventListener("keydown", e => {

  // ---------- keyboard shortcuts ----------
  const typing = el => el.closest?.("input, textarea, select, [contenteditable], dialog");
  let holding = false;
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { stopSpeaking(); if (reviewTimer) editMode(); return; }
    if (e.code !== "Space" || typing(e.target) || (screen !== "Chat" && screen !== "Solo")) return;
    e.preventDefault();
    if (e.repeat || holding) return;
    holding = true;
    startRec(screen === "Chat" ? myLang() : pttLang, "hold");
  });
  document.addEventListener("keyup", e => {
    if (e.code !== "Space" || !holding) return;
    e.preventDefault();
    holding = false;
    stopRec();
  });

  // ---------- two devices ----------
  // Messages go through the free, open-source relay ntfy.sh, encrypted with AES-GCM. Both the relay
  // topic and the key are derived from an 8-digit code with PBKDF2, so the code itself never leaves
  // the device and the topic name does not reveal it cheaply. Digits work on Danish and Russian
  // keyboard layouts alike.
  const RELAY = "https://ntfy.sh/";
  const myId = Math.random().toString(36).slice(2, 10);
  const seen = new Set();
  let room = null; // { code, topic, key, role, es, since, peer, state }

  const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
  const newCode = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 1e8).padStart(8, "0");
  const fmtCode = c => c.slice(0, 4) + " " + c.slice(4);

  async function deriveRoom(code) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits", "deriveKey"]);
    const kdf = salt => ({ name: "PBKDF2", hash: "SHA-256", iterations: 150000, salt: enc.encode(salt) });
    const topicBits = await crypto.subtle.deriveBits(kdf("tolk-da-ru/topic"), base, 96);
    const key = await crypto.subtle.deriveKey(kdf("tolk-da-ru/key"), base, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
    return { topic: "tolk-" + b64u(topicBits), key };
  }
  async function encrypt(obj, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return b64u(iv) + "." + b64u(ct);
  }
  async function decrypt(str, key) {
    const [iv, ct] = str.split(".");
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(iv) }, key, unb64u(ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  const roomHash = (code, role) => "#kode=" + code + "." + role;
  const inviteUrl = () => location.origin + location.pathname + roomHash(room.code, other(room.role));
  const siteUrl = () => (location.host + location.pathname).replace(/\/index\.html$/, "/").replace(/\/$/, "");

  // starter: the one who created the code waits on the code screen; the other goes straight to the chat.
  async function joinRoom(code, role, starter) {
    if (!window.crypto?.subtle) { toast(t("https"), true); return; }
    leaveRoom(true);
    toast(t("connecting"));
    const { topic, key } = await deriveRoom(code);
    toast("");
    room = { code, topic, key, role, since: Math.floor(Date.now() / 1000) - 5, peer: false, state: "wait" };
    try { history.replaceState(null, "", roomHash(code, role)); } catch {}
    clearChat();
    subscribe(room);
    relaySend({ k: "hello", role });
    keepAwake(true);
    go(starter ? "Wait" : "Chat");
  }

  function subscribe(r) {
    if (room !== r) return;
    r.es?.close();
    const es = r.es = new EventSource(RELAY + r.topic + "/sse?since=" + encodeURIComponent(r.since));
    es.onopen = () => {
      clearTimeout(r.downTimer); r.downTimer = null;
      if (room === r && r.state === "err") { r.state = r.peer ? "ok" : "wait"; renderRoom(); }
    };
    es.onmessage = e => onRelay(r, e.data);
    es.onerror = () => {
      es.close();
      if (room !== r) return;
      // Short drops are normal on phones; only report a problem if reconnecting takes a while.
      r.downTimer ??= setTimeout(() => { if (room === r) { r.state = "err"; renderRoom(); } }, 8000);
      setTimeout(() => subscribe(r), 3000);
    };
  }

  async function onRelay(r, data) {
    let j;
    try { j = JSON.parse(data); } catch { return; }
    if (j.event !== "message" || seen.has(j.id)) return;
    seen.add(j.id);
    r.since = j.id;
    let m;
    try { m = await decrypt(j.message, r.key); } catch { return; }
    if (room !== r || m.from === myId) return;
    switch (m.k) {
      case "hello":
      case "here":
        r.peer = true; r.state = "ok";
        if (m.k === "hello") relaySend({ k: "here", role: r.role });
        if (m.role === r.role) toast(t("sameLang"), true);
        if (screen === "Wait") go("Chat"); else renderRoom();
        break;
      case "bye": r.peer = false; r.state = "left"; hideTalking(); renderRoom(); break;
      case "msg": receive(m); break;
      case "ack": markDelivered(m.mid); break;
      case "talk": showTalking(); break;
      case "idle": hideTalking(); break;
    }
  }

  async function relaySend(obj) {
    if (!room) return false;
    const r = room;
    try {
      const body = await encrypt({ ...obj, from: myId }, r.key);
      if (body.length > 3800) { toast(t("tooLong"), true); return false; }
      const res = await fetch(RELAY + r.topic, { method: "POST", body });
      return res.ok;
    } catch { return false; }
  }

  function leaveRoom(silent) {
    if (!room) return;
    if (!silent) relaySend({ k: "bye" });
    room.es?.close();
    room = null;
    keepAwake(false);
    clearChat();
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  }

  let qrFor = "";
  function renderRoom() {
    if (!room) return;
    const st = room.state;
    $("chatDot").className = "dot " + st;
    $("chatState").textContent = t({ ok: "connected", wait: "waiting", err: "lost", left: "peerLeft" }[st]);
    $("codeChip").textContent = room.peer ? "" : "· " + t("code") + " " + fmtCode(room.code);
    $("codeText").textContent = fmtCode(room.code);
    $("howOwn").textContent = t("how", { url: siteUrl() });
    $("howOther").textContent = t("how", { url: siteUrl() }, other(room.role));
    $("howOther").lang = other(room.role);
    const url = inviteUrl();
    if (qrFor !== url && window.qrcode) {
      qrFor = url;
      const q = qrcode(0, "M"); q.addData(url); q.make();
      $("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }
    $("qr").parentElement.hidden = !window.qrcode;
  }

  // Keep a phone or tablet screen on while connected, so it doesn't sleep in the middle of a conversation.
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }
  // Phones and tablets suspend background tabs without always reporting a lost connection.
  // When the page is visible again, reconnect and fetch what arrived in the meantime.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !room) return;
    keepAwake(true);
    subscribe(room);
  });

  // ---------- wiring ----------
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { setUi(b.dataset.pick); go("Home"); });
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { setUi(b.dataset.ui); if (screen === "Lang") go("Home"); });
  $("startBtn").onclick = () => joinRoom(newCode(), ui, true);
  $("soloBtn").onclick = () => { clearSolo(); go("Solo"); };
  $("joinForm").addEventListener("submit", e => {
    e.preventDefault();
    const code = $("joinCode").value.replace(/\D/g, "");
    if (code.length !== 8) { toast(t("codeLen"), true); $("joinCode").focus(); return; }
    $("joinCode").value = "";
    $("joinCode").blur();
    joinRoom(code, ui, false);
  });
  $("joinCode").addEventListener("input", e => {
    // Show the code as "1234 5678" while typing.
    const d = e.target.value.replace(/\D/g, "").slice(0, 8);
    e.target.value = d.length > 4 ? d.slice(0, 4) + " " + d.slice(4) : d;
  });
  $("cancelWait").onclick = () => { leaveRoom(false); go("Home"); };
  $("leaveBtn").onclick = () => { leaveRoom(false); go("Home"); };
  $("backBtn").onclick = () => go("Home");
  $("clearBtn").onclick = clearSolo;
  $("flipBtn").onclick = () => {
    const on = $("stage").classList.toggle("flip");
    $("flipBtn").setAttribute("aria-pressed", String(on));
  };
  $("copyLink").onclick = async () => {
    const url = inviteUrl();
    try { await navigator.clipboard.writeText(url); toast(t("copied")); }
    catch { toast(t("copyManual", { url })); }
  };
  $("setBtn").onclick = () => { const d = $("settings"); d.showModal ? d.showModal() : d.setAttribute("open", ""); };

  // ---------- start ----------
  loadVoices();
  const joined = location.hash.match(/^#kode=(\d{8})\.(da|ru)$/);
  if (joined) {
    // Opened from the other person's link or QR code: the link says which language this person speaks.
    setUi(joined[2]);
    joinRoom(joined[1], joined[2], false);
  } else {
    applyTexts();
    go(ui ? "Home" : "Lang");
  }
})();
</script>
</body>
</html>
